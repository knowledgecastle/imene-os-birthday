<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230E1116'/%3E%3Cpath d='M9 11l5 5-5 5M16 21h7' stroke='%23D97757' stroke-width='2.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- lofi scene -->
  <div class="scene" aria-hidden="true">
    <div class="scene-img scene-light"></div>
    <div class="scene-img scene-dark"></div>
    <div class="scene-tint"></div>
    <canvas class="rain" id="rain"></canvas>
    <div class="dots"></div>
    <div class="grain"></div>
  </div>

  <!-- boot -->
  <div class="boot" id="boot" hidden>
    <pre class="boot-text" id="bootText" aria-live="polite"></pre>
    <button class="boot-skip" id="bootSkip" type="button">Skip</button>
  </div>

  <!-- top bar -->
  <header class="topbar">
    <div class="brand"><span class="brand-dot"></span>imene.os</div>
    <div class="topbar-right">
      <span class="clock mono" id="clock" aria-label="local time"></span>
      <span class="progress mono" id="progress" aria-live="polite">year explored 0/8</span>
      <button class="icon-btn" id="trophyBtn" type="button" aria-label="Open achievements"></button>
    </div>
  </header>

  <main class="desktop" id="desktop">
    <nav class="icons icons-left" id="iconsLeft" aria-label="Desktop icons"></nav>

    <section class="terminal" id="terminal" aria-label="Terminal">
      <div class="term-bar">
        <span class="lights" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="term-title mono" id="termTitle"></span>
        <button class="term-close" id="termRestore" type="button" hidden aria-label="Close finale">×</button>
      </div>
      <div class="term-body mono" id="termBody">
        <div class="term-out" id="termOut" aria-live="polite"></div>
        <form class="term-line" id="termForm" autocomplete="off">
          <label for="termInput" class="term-prompt" id="termPrompt"></label>
          <span class="term-input-wrap">
            <input id="termInput" class="term-input" type="text" spellcheck="false" autocapitalize="off" autocorrect="off" enterkeyhint="go" aria-label="Terminal command">
            <span class="term-ghost" id="termGhost" aria-hidden="true"></span>
          </span>
        </form>
      </div>
    </section>

    <nav class="icons icons-right" id="iconsRight" aria-label="More desktop icons"></nav>
  </main>

  <footer class="dock" aria-label="Dock">
    <button class="dock-btn" id="restartBtn" type="button"></button>
    <button class="dock-btn" id="themeBtn" type="button"></button>
    <button class="dock-btn" id="soundBtn" type="button" aria-pressed="false"></button>
    <span class="now-playing mono" id="nowPlaying" hidden>♪ lofi rain, side b</span>
  </footer>

  <div class="windows" id="windows"></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div class="confetti" id="confetti" aria-hidden="true"></div>

  <script src="icons.js"></script>
  <script src="content.js"></script>
  <script src="app.js"></script>
</body>
</html>
